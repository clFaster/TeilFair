name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '26'

      - name: Setup pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093
        with:
          cache: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm run build:shared

      - name: Run tests
        run: pnpm run test

      - name: Lint web package
        run: pnpm run lint

      - name: Typecheck mobile package
        run: pnpm run typecheck:mobile

      - name: Build web package
        run: pnpm run build:web

      - name: Install Playwright browser
        run: pnpm --filter @teilfair/web exec playwright install --with-deps chromium

      - name: Smoke test production web build
        run: pnpm run test:smoke

      - name: Export mobile bundles
        env:
          EXPO_PUBLIC_SUPABASE_URL: https://smoke-test.supabase.co
          EXPO_PUBLIC_SUPABASE_ANON_KEY: smoke-test-anon-key
        run: pnpm run export:mobile --platform all

      - name: Upload web build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: web-build
          path: packages/web/dist
          retention-days: 7
